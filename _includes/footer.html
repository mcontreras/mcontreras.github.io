<footer>
  <div class="wrap">
    <div class="footer-inner">
      <span class="footer-copy">{{ site.title }} © {{ site.time | date: "%Y" }}</span>
      <div class="footer-links">
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        {% if site.author.linkedin %}
        <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        {% endif %}
        {% if site.author.mastodon %}
        <a href="{{ site.author.mastodon }}" target="_blank" rel="noopener me">Mastodon</a>
        {% endif %}
        {% if site.google_analytics %}
        <button type="button" class="footer-link-btn" onclick="openCookieBanner()">Cookies</button>
        {% endif %}
      </div>
    </div>
  </div>
</footer>
