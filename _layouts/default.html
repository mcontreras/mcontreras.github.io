<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body>
  {% include header.html %}
  <main class="main">
    {{ content }}
  </main>
  {% include footer.html %}

  {% if site.google_analytics %}
  <!-- Banner de cookies -->
  <div id="cookie-banner" style="display:none" role="dialog" aria-modal="false" aria-labelledby="cookie-banner-text">
    <p id="cookie-banner-text">Uso Google Analytics para saber cuántas personas visitan el sitio. ¿Aceptas las cookies analíticas?</p>
    <div class="cookie-actions">
      <button type="button" onclick="setCookies('rejected')" class="cookie-btn cookie-btn--secondary">No, gracias</button>
      <button type="button" onclick="setCookies('accepted')" class="cookie-btn cookie-btn--primary">Aceptar</button>
    </div>
  </div>
  {% endif %}

  <script>
    // Theme
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      var icon = theme === 'dark' ? '☽' : '☀';
      ['themetoggle','themetoggle-mobile'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.textContent = id === 'themetoggle-mobile' ? icon + '\u00a0 Cambiar tema' : icon;
      });
    }

    // Aplica el tema al cargar: prioridad → preferencia manual → preferencia del sistema
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        applyTheme(saved || preferred);
      } catch (e) {
        var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        applyTheme(preferred);
      }
    })();

    // Escucha cambios en el tema del sistema en tiempo real
    // Solo aplica si el usuario no ha elegido manualmente un tema
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      try {
        if (!localStorage.getItem('theme')) {
          applyTheme(e.matches ? 'dark' : 'light');
        }
      } catch (err) {
        applyTheme(e.matches ? 'dark' : 'light');
      }
    });

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
      applyTheme(next);
    }

    {% if site.google_analytics %}
    var GA_MEASUREMENT_ID = '{{ site.google_analytics }}';

    // Manejo de Cookies y Almacenamiento
    function setCookie(name, value, days) {
      var expires = '';
      if (days) {
        var d = new Date();
        d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = '; expires=' + d.toUTCString();
      }
      var secure = window.location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/; SameSite=Lax' + secure;
    }

    function getCookie(name) {
      var prefix = name + '=';
      var cookies = document.cookie.split(';');
      for (var i = 0; i < cookies.length; i++) {
        var c = cookies[i].trim();
        if (c.indexOf(prefix) === 0) {
          return decodeURIComponent(c.substring(prefix.length));
        }
      }
      return null;
    }

    function deleteCookie(name) {
      var host = window.location.hostname;
      var domains = ['', '.' + host];
      var parts = host.split('.');
      if (parts.length > 2) {
        domains.push('.' + parts.slice(-2).join('.'));
      }
      domains.forEach(function(d) {
        var domainStr = d ? '; domain=' + d : '';
        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/' + domainStr;
      });
    }

    function deleteGACookies() {
      var cookies = document.cookie.split(';');
      for (var i = 0; i < cookies.length; i++) {
        var name = cookies[i].trim().split('=')[0];
        if (name.indexOf('_ga') === 0 || name.indexOf('_gid') === 0 || name.indexOf('_gat') === 0) {
          deleteCookie(name);
        }
      }
    }

    function getConsent() {
      var fromCookie = getCookie('cookie_consent') || getCookie('cookies');
      if (fromCookie) return fromCookie;
      try {
        var fromStorage = localStorage.getItem('cookie_consent') || localStorage.getItem('cookies');
        if (fromStorage) {
          setCookie('cookie_consent', fromStorage, 365);
          setCookie('cookies', fromStorage, 365);
          return fromStorage;
        }
      } catch (e) {}
      return null;
    }

    // Google Consent Mode v2
    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function(){ window.dataLayer.push(arguments); };

    var initialConsent = getConsent();
    window.gtag('consent', 'default', {
      'analytics_storage': initialConsent === 'accepted' ? 'granted' : 'denied',
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied'
    });

    function openCookieBanner() {
      var banner = document.getElementById('cookie-banner');
      if (banner) banner.style.display = 'flex';
    }

    function closeCookieBanner() {
      var banner = document.getElementById('cookie-banner');
      if (banner) banner.style.display = 'none';
    }

    function loadGA() {
      if (window['ga-disable-' + GA_MEASUREMENT_ID]) {
        delete window['ga-disable-' + GA_MEASUREMENT_ID];
      }

      window.gtag('consent', 'update', {
        'analytics_storage': 'granted'
      });

      var existing = document.getElementById('ga-script');
      if (!existing) {
        var s = document.createElement('script');
        s.id = 'ga-script';
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID;
        document.head.appendChild(s);

        window.gtag('js', new Date());
        window.gtag('config', GA_MEASUREMENT_ID, {
          transport_type: 'beacon'
        });
      }
    }

    function disableGA() {
      window['ga-disable-' + GA_MEASUREMENT_ID] = true;
      if (window.gtag) {
        window.gtag('consent', 'update', {
          'analytics_storage': 'denied'
        });
      }
      deleteGACookies();
    }

    function setCookies(choice) {
      setCookie('cookie_consent', choice, 365);
      setCookie('cookies', choice, 365);
      try {
        localStorage.setItem('cookie_consent', choice);
        localStorage.setItem('cookies', choice);
      } catch (e) {}

      closeCookieBanner();

      if (choice === 'accepted') {
        loadGA();
      } else {
        disableGA();
      }
    }

    // Cerrar banner con Escape si está abierto
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeCookieBanner();
      }
    });

    (function() {
      var consent = getConsent();
      if (consent === 'accepted') {
        loadGA();
      } else if (!consent) {
        openCookieBanner();
      }
    })();
    {% endif %}

    // Mobile menu
    function toggleMenu() {
      var btn = document.getElementById('nav-hamburger');
      var dd  = document.getElementById('nav-dropdown');
      if (!btn || !dd) return;
      var open = dd.classList.toggle('open');
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open);
    }

    document.addEventListener('click', function(e) {
      var nav = document.getElementById('nav');
      if (nav && !nav.contains(e.target)) {
        var dd  = document.getElementById('nav-dropdown');
        var btn = document.getElementById('nav-hamburger');
        if (dd)  dd.classList.remove('open');
        if (btn) btn.classList.remove('open');
      }
    });
  </script>
</body>
</html>
