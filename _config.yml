title: Manu Contreras
description: Veinte años escribiendo sobre tecnología, seguridad y medios.
url: "https://manucontreras.com"
baseurl: ""
lang: es-ES
locale: es_ES
timezone: Europe/Madrid
image: /assets/images/manu.jpg

author:
  name: Manu Contreras
  email: manu@contreras.cc
  location: Madrid, España
  linkedin: https://www.linkedin.com/in/mcontreras
  mastodon: https://mastodon.social/@mcontreras
  bluesky: https://bsky.app/profile/manucontreras.com
  threads: https://www.threads.com/@mcontreras

social:
  name: Manu Contreras
  links:
    - https://www.linkedin.com/in/mcontreras
    - https://mastodon.social/@mcontreras
    - https://bsky.app/profile/manucontreras.com
    - https://www.threads.com/@mcontreras

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /notas/:title

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - README.md
  - _preview

# Feed
feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/manu.jpg
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      author: Manu Contreras
      image: /assets/images/manu.jpg
